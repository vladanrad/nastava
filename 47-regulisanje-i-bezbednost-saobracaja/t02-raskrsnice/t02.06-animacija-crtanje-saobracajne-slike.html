<style>

  table { border-collapse:collapse; width:100%; font-size:clamp(13px, 2.3vw, 17px); color:#FFFFFF; background:#13284D; }

  th { background:#22406E; color:#FFFFFF; }

  .bar i { display:block; height:100%; width:0; background:var(--cur); }
  .end { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }

  svg g.on, svg g.cur, svg g.old, svg g.erase, svg g.fin, svg g.done { display:inline; }

  g.cur path { stroke:var(--cur); stroke-width:.6; stroke-dasharray:1; stroke-dashoffset:1; animation:draw 3.2s ease-in-out forwards; }
  g.old path { stroke:var(--old); stroke-width:.3; }
  g.erase path { stroke:var(--cur); stroke-width:.32; animation:fade 2.6s 3.5s ease forwards; }
  g.fin path { stroke:#FFFFFF; stroke-width:.55; stroke-dasharray:1; stroke-dashoffset:1; animation:draw 4.5s .3s ease-in-out forwards; }

  path.hd { stroke:var(--help) !important; stroke-width:.25 !important; stroke-dasharray:1 .7 !important; animation:none !important; }
  .hdot { fill:var(--help); }
  path.hr { stroke:var(--help) !important; stroke-width:.4 !important; stroke-dasharray:none !important; animation:none !important; }
  .rl { fill:#FFFFFF; font-weight:700; paint-order:stroke; stroke:#0B1E3F; stroke-width:.8; }
  .num { fill:#2E5A9E; } .numt { fill:#FFFFFF; font-weight:700; }
  .tx { fill:#FFFFFF; } .txb { fill:#FFFFFF; font-weight:700; } .txr { fill:var(--cur); font-weight:700; }

  @keyframes fade { to { opacity:0; } }
  @keyframes appear { from { opacity:0; } to { opacity:1; } }
  @keyframes blink { 50% { opacity:0; } }

    now = starts[i]; next = 0; capText = "";
    while (next < EV.length && EV[next].t < now) next++;
    cap.classList.add("hide"); stage.classList.remove("done");
    setPlaying(true);
  }
  function curStep() { var k = 0; for (var i = 0; i < starts.length; i++) if (starts[i] <= now) k = i; return k; }
  function setPlaying(p) {
    playing = p; stage.classList.toggle("paused", !p);
    pp.textContent = p ? "❚❚" : "▶"; pp.setAttribute("aria-label", p ? "Пауза" : "Пусти");
  }
  pp.addEventListener("click", function () {
    if (stage.classList.contains("done")) { seekStep(0); return; }
    setPlaying(!playing);
  });
  document.getElementById("back").addEventListener("click", function () {
    var k = curStep(); if (now - starts[k] < 2500 && k > 0) k--; seekStep(k);
  });
  document.getElementById("again").addEventListener("click", function () { seekStep(0); });
  document.addEventListener("keydown", function (e) {
    if (e.key === " ") { e.preventDefault(); pp.click(); }
    if (e.key === "ArrowLeft") document.getElementById("back").click();
  });
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
